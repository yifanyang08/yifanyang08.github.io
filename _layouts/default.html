{%- assign page_lang = page.lang | default: site.lang -%}
{%- assign t = site.data.i18n[page_lang] | default: site.data.i18n['en'] -%}
<!doctype html>
<html lang="{{ t.html_lang }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">{{ t.skip_link }}</a>
    {% include header.html %}
    <main id="main-content" class="site-main">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
