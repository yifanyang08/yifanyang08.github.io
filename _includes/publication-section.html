{% assign items = site.data.publications | where: 'type', include.type | sort: 'year' | reverse %}
<section class="content-section" id="{{ include.id }}">
  <div class="section-heading">
    <p class="eyebrow">{{ include.eyebrow }}</p>
    <h2>{{ include.title }}</h2>
  </div>
  <div class="publication-list">
    {% for item in items %}
      {% include publication-item.html item=item %}
    {% endfor %}
  </div>
</section>
