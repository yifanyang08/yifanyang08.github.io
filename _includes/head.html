{%- assign page_lang = page.lang | default: site.lang -%}
{%- assign t = site.data.i18n[page_lang] | default: site.data.i18n['en'] -%}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F8FA">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% include visitor-tracker.html %}
  {% seo %}
  <link rel="alternate" hreflang="{{ t.html_lang }}" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
  <meta property="og:locale" content="en_US">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Yifan Yang",
      "alternateName": "Yang Yifan",
      "jobTitle": "Assistant Professor of Linguistics",
      "affiliation": {
        "@type": "CollegeOrUniversity",
        "name": "Shanghai Jiao Tong University"
      },
      "url": "{{ site.url }}{{ site.baseurl }}",
      "email": "mailto:yifanyang@sjtu.edu.cn",
      "sameAs": {{ site.social.links | jsonify }}
    }
  </script>
</head>
