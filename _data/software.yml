  summary: "A classroom-oriented speech synthesis tool for creating multi-speaker dialogues, accent-based voices, maritime radio exchanges, VHF number reading, and configurable radio effects."
  summary_zh: "面向课堂听说教学的多角色对话语音合成工具，支持不同口音和角色声音、海事无线电通话、VHF数字读法、情绪控制及可配置的无线电音效。"
  overview: "Classroom Dialogue TTS is planned as a tool for preparing spoken classroom materials that involve multiple speakers, structured exchanges, and specialized listening-practice scenarios."
  overview_zh: "Classroom Dialogue TTS 计划作为准备课堂口语材料的工具，用于制作涉及多角色、结构化会话以及专项听力练习场景的材料。"
  motivation: "The tool is intended to make repeatable, configurable listening materials easier to prepare for professional communication and language teaching contexts."
  motivation_zh: "该工具旨在为专业沟通与语言教学场景更轻松地制作可重复、可配置的听力材料。"
  features:
