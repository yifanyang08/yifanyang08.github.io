- id: "fieldwork-recorder"
  name: "Fieldwork Recorder"
  name_zh: "Fieldwork Recorder（田野录音工具）"
  url: "/software/fieldwork-recorder/"
  url_zh: "/zh/software/fieldwork-recorder/"
  status: "Beta"
  tags:
    - "macOS"
    - "Fieldwork"
    - "Local-first"
    - "Beta"
  tags_zh:
    - "macOS"
    - "田野调查"
    - "本地优先"
    - "测试版"
  summary: "A macOS application for structured lexical elicitation and field recording, with session management, item-level metadata, playback, re-recording, and export workflows designed for subsequent annotation and forced alignment."
  summary_zh: "面向语言田野调查和结构化词表录音的macOS应用，支持录音任务管理、词项元数据、回听、重录和规范化导出，并可衔接后续的Praat标注、TextGrid制作和强制对齐流程。"
  overview: "Fieldwork Recorder supports structured lexical elicitation and audio collection by organizing sessions around word lists, speaker and item metadata, and repeatable recording workflows."
  overview_zh: "田野录音工具围绕结构化词表组织词汇诱发与录音采集，以词表、发音人与词项元数据为中心管理会话，并支持可重复的录音工作流程。"
  motivation: "The tool is designed for fieldwork situations where consistency, local storage, and later annotation workflows matter. It keeps the recording process close to the elicitation structure rather than treating audio files as detached artifacts."
  motivation_zh: "该工具面向田野调查中一致性、本地存储与后续标注流程尤为重要的场景，使录音过程贴近诱发结构，而不是把音频文件当作相互孤立的产物。"
  features:
    - "structured word-list import"
    - "practice and recording items"
    - "session progress management"
    - "playback and re-recording"
    - "item-level metadata"
    - "consistent file naming"
    - "export for annotation"
    - "preparation for Praat/TextGrid/MFA workflows"
    - "local storage and privacy"
  features_zh:
    - "结构化词表导入"
    - "练习与正式录音词项"
    - "会话进度管理"
    - "回听与重录"
    - "词项级元数据"
    - "统一文件命名"
    - "可导出用于标注"
    - "为Praat/TextGrid/MFA流程准备"
    - "本地存储与隐私保护"
  requirements: "macOS. More detailed version requirements are coming soon."
  requirements_zh: "macOS。更详细的版本要求即将推出。"
  download: "Coming soon."
  download_zh: "即将推出。"
