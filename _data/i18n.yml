    profile_alt: "杨一帆 肖像"
    hero_lede: "我主要从事音系学研究，关注音系、语音与形态之间的接口关系。研究领域包括汉语方言非串联式形态、重叠、音节结构以及音系表征，并结合语言田野调查、声学分析和发音运动研究等方法开展工作。"
    btn_research: "研究方向"
    btn_publications: "发表成果"
    btn_software: "软件与资源"
    btn_cv: "下载简历"
