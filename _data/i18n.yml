    card_nonconcatenative_title: "非串联式形态"
    card_nonconcatenative_text: "汉语方言中的变韵、小称构词与减除（subtraction）模式。"
    card_nonconcatenative_label: "了解非串联式形态与变韵研究"
    card_reduplication_title: "重叠式一致性"
    card_reduplication_text: "重叠中的对应关系、表层对应（Surface Correspondence）与一致性效应。"
    card_reduplication_label: "了解重叠式一致性研究"
    card_syllable_title: "音节结构"
    card_syllable_text: "音节组织的时间协调与声学证据。"
    card_syllable_label: "了解音节结构与时间协调研究"
    card_ladin_title: "拉丁语族语音"
    card_ladin_text: "基于田野调查的法萨谷（Val di Fassa）方言语音与音系研究。"
    card_ladin_label: "了解拉登语（Ladin）语音与音系研究"
    selected_eyebrow: "代表性成果"
