    profile_alt: "Portrait of Yifan Yang"
    hero_lede: "I am a phonologist working at the interface of phonology, phonetics, and morphology. I am interested in how sound patterns and word structure shape each other, and I study this through various morphophonological phenomena in understudied Chinese dialects. My approach combines formal analysis with fieldwork and acoustic methods. I also ask whether, and how, speech and large language models acquire comparable phonological abstractions. In Mandarin Chinese, my name is pronounced [i˥.fan˧˥.jɑŋ˧˥]."
