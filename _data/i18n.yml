    about_heading: "More about me"
    about_p1: "My work often combines phonological theories with empirical data collected through fieldwork and phonetic analysis, aiming to bridge the theoretical and empirical dimensions of phonology."
    about_p2: "I primarily focus on understudied Chinese dialects, with a particular emphasis on diminutive patterns: the ways languages modify words to make them sound smaller, cuter, or more affectionate. My fascination with these intricate patterns traces back to the local dialects of my hometown and the nostalgic memories of my grandmother's words."
