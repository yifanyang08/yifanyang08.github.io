    about_heading: "关于我"
    about_p1: "我的研究常将音系学理论与通过田野调查和语音分析获得的实证数据相结合，力求沟通音系学的理论与实证两个维度。"
    about_p2: "我主要关注尚未得到充分研究的汉语方言，尤其是小称模式：语言通过改变词形使词语听起来更小、更可爱或更亲切的各种方式。我对这些精细模式的兴趣可以追溯到家乡方言以及祖母话语中的怀旧记忆。"
