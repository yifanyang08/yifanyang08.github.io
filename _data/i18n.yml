    profile_alt: "Portrait of Yifan Yang"
    hero_lede: "I am a phonologist working at the interface of phonology, phonetics, and morphology. My research focuses on nonconcatenative morphology, reduplication, syllable structure, and the sound patterns of understudied Chinese dialects. I combine formal analysis with linguistic fieldwork and acoustic and articulatory methods. In Mandarin Chinese, my name is pronounced [i˥.fan˧˥.jɑŋ˧˥]."
